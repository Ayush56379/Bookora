  <script type="module">(()=>{const APP_URL='./js/app-safe.js?v=20260828-publish-rebuild';let booted=false,recoveryShown=false;const showRecovery=reason=>{if(booted||recoveryShown||document.querySelector('#main-content'))return;recoveryShown=true;console.error('[Bookora startup]',reason);const app=document.getElementById('app');if(!app)return;app.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;font-family:Inter,system-ui,sans-serif"><div style="max-width:620px"><div style="font-size:42px">📚</div><h2 style="color:#0f172a">Bookora is recovering…</h2><p style="color:#64748b;line-height:1.6">The application did not finish starting. Your account, orders and books were not changed.</p><button id="bookora-start-retry" type="button" style="padding:11px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer">Try Again</button></div></main>';document.getElementById('bookora-start-retry')?.addEventListener('click',()=>location.reload(),{once:true})};window.addEventListener('error',e=>{if(!booted&&String(e?.filename||'').includes('/js/'))setTimeout(()=>showRecovery(e.error||e.message),0)});window.addEventListener('unhandledrejection',e=>{if(!booted)showRecovery(e.reason)});const boot=async()=>{try{await import(APP_URL);booted=true;window.__BOOKORA_CORE_BOOTED__=true}catch(error){showRecovery(error)}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();setTimeout(()=>{if(!booted&&!document.querySelector('#main-content'))showRecovery('startup timeout')},12000)})();</script>
