  <!-- Recovery UI: never reload the page and never replace a successfully rendered SPA. -->
  <script>
    (() => {
      let recoveryShown = false;
      const showRecovery = (reason) => {
        if (recoveryShown || document.querySelector('#main-content')) return;
        recoveryShown = true;
        const app = document.getElementById('app');
        if (!app) return;
        console.error('[Bookora startup]', reason || 'core application failed to start');
        app.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;font-family:Inter,system-ui,sans-serif"><div><h2 style="margin:0 0 10px;color:#0f172a">Bookora is having trouble starting</h2><p style="margin:0 0 18px;color:#64748b">The page did not finish starting. Your account and data have not been changed.</p><button type="button" id="bookora-start-retry" style="padding:11px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer">Try Again</button></div></main>';
        document.getElementById('bookora-start-retry')?.addEventListener('click', () => location.reload());
      };
      window.addEventListener('error', event => {
        const file = String(event?.filename || '');
        if (file.includes('/js/')) setTimeout(() => showRecovery(event.error || event.message), 0);
      });
      window.addEventListener('unhandledrejection', event => {
        console.error('[Bookora startup rejection]', event.reason);
      });
      setTimeout(() => {
        if (!document.querySelector('#main-content') && !window.__BOOKORA_APP_INSTANCE__) showRecovery('core app instance was not created');
      }, 10000);
    })();
  </script>
