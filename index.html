    ];
    const OPTIONAL_CLASSIC = ['./js/menu-permanent-fix.js?v=20260823-2'];

    function addClassic(src) {
      return new Promise(resolve => {
        const s = document.createElement('script');
        s.src = src; s.async = true; s.onload = resolve; s.onerror = () => resolve();
        document.body.appendChild(s);
      });
    }

    async function boot() {
      for (const src of CRITICAL_CLASSIC) await addClassic(src);
      try {
        await import(APP_URL);
      } catch (error) {
        console.error('[Bookora boot] app.js failed:', error);
        const app = document.getElementById('app');
        if (app && !document.querySelector('#main-content')) {
          app.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;font-family:Inter,sans-serif"><div><h2>Bookora is starting…</h2><p style="color:#64748B">The application could not start normally.</p><button id="bookora-boot-retry" style="padding:10px 18px;border:0;border-radius:10px;background:#2563EB;color:#fff;font-weight:700;cursor:pointer">Retry</button></div></main>';
          document.getElementById('bookora-boot-retry')?.addEventListener('click', () => location.reload());
        }
        return;
      }

      const loadOptional = () => {
        OPTIONAL_MODULES.forEach(src => import(src).catch(error => console.warn('[Bookora optional runtime skipped]', src, error)));
        OPTIONAL_CLASSIC.forEach(addClassic);
      };

      if ('requestIdleCallback' in window) requestIdleCallback(loadOptional, { timeout: 1500 });
      else setTimeout(loadOptional, 300);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
    else boot();
  </script>
