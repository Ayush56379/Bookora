  <noscript><div style="padding:3rem;text-align:center;font-family:sans-serif;background:#FFF1F2;color:#9F1239;"><h2>JavaScript Required</h2><p>JavaScript is required to use Bookora.</p></div></noscript>

  <!-- Deterministic core boot: dynamic import catches module-graph failures instead of leaving a blank page. -->
  <script type="module">
    (() => {
      const APP_URL = './js/app.js?v=20260823-6';
      let booted = false;
      let recoveryShown = false;

      const showRecovery = (reason) => {
        if (booted || recoveryShown || document.querySelector('#main-content')) return;
        recoveryShown = true;
        const app = document.getElementById('app');
        if (!app) return;
        console.error('[Bookora boot] core startup failed:', reason);
        app.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;font-family:Inter,system-ui,sans-serif"><div style="max-width:620px"><div style="font-size:42px;margin-bottom:10px">📚</div><h2 style="margin:0 0 10px;color:#0f172a">Bookora could not start</h2><p style="margin:0 0 18px;color:#64748b;line-height:1.6">The application startup was interrupted. Your account, orders and books were not changed.</p><button type="button" id="bookora-start-retry" style="padding:11px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer">Try Again</button></div></main>';
        document.getElementById('bookora-start-retry')?.addEventListener('click', () => location.reload(), { once: true });
      };

      const boot = async () => {
        try {
          await import(APP_URL);
          booted = true;
          window.__BOOKORA_CORE_BOOTED__ = true;
        } catch (error) {
          showRecovery(error);
        }
      };

      window.addEventListener('error', event => {
        if (String(event?.filename || '').includes('/js/')) showRecovery(event.error || event.message);
      });
      window.addEventListener('unhandledrejection', event => {
        if (!booted) showRecovery(event.reason);
        else console.warn('[Bookora runtime rejection]', event.reason);
      });

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
      else boot();

      setTimeout(() => {
        if (!booted && !document.querySelector('#main-content')) showRecovery('startup timeout');
      }, 12000);
    })();
  </script>

  <!-- Optional runtimes load only after the core SPA has rendered. A failed optional module is isolated. -->

        './js/settings-route-sync-hotfix.js?v=20260822-1',
        './js/profile-menu-stability.js?v=20260822-1',
        './js/payment-success-verification-hotfix.js?v=20260821-7',
        './js/payment-success-responsive-hotfix.js?v=20260821-1',
        './js/orders-page-permanent-fix.js?v=20260821-6',
        './js/orders-page-render-sync.js?v=20260821-2',
        './js/homepage-catalog-enhancement.js?v=20260820-1',
        './js/homepage-catalog-cleanup.js?v=20260823-2',

        './js/book-detail-permanent-fix.js?v=20260819-6',
        './js/book-detail-reviews-runtime.js?v=20260823-3',
        './js/book-author-profile-runtime.js?v=20260823-1',
        './js/book-reviews-runtime.js?v=20260823-5',
        './js/book-sample-secure-reader.js?v=20260820-5',
        './js/free-sample-permanent-fix.js?v=20260820-5',
        './js/book-card-size-fix.js?v=20260820-1',
        './js/checkout-image-hotfix.js?v=20260820-3',
        './js/payment-auth-session-fix.js?v=20260820-2',
        './js/book-cover-display-fix.js?v=20260820-1',
        './js/mode-specific-menu-fix.js?v=20260820-1',
        './js/mobile-mode-switcher.js?v=20260823-boot2',
        './js/book-card-detail-click-fix.js?v=20260820-2',
        './js/external-bookora-commerce.js?v=20260821-1',
        './js/external-bookora-detail-ui.js?v=20260822-1',
        './js/external-purchase-flow.js?v=20260822-1',
        './js/external-integration-ui.js?v=20260822-1',
        './js/book-detail-related-mobile-fix.js?v=20260822-1',
        './js/smart-search-runtime.js?v=20260822-1'
      ];
      const load = async () => {
        if (!window.__BOOKORA_CORE_BOOTED__) return;
        for (const src of modules) {
          try {
            if (src.includes('firestore-book-sync') || src.includes('google-drive-resumable-bridge') || src.includes('auth-buyer-only')) {
              await new Promise(resolve => {
                const s = document.createElement('script');
                s.src = src;
                s.defer = true;
                s.onload = s.onerror = resolve;
                document.body.appendChild(s);
              });
            } else {
              await import(src);
            }
          } catch (error) {
            console.warn('[Bookora optional runtime skipped]', src, error);
          }
        }
      };
      const start = () => load();
      if ('requestIdleCallback' in window) requestIdleCallback(start, { timeout: 2500 });
      else setTimeout(start, 1500);
    })();
  </script>
  <script src="js/menu-permanent-fix.js?v=20260823-2" defer></script>
