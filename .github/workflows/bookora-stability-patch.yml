name: Bookora production stability patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted stability fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  print('SKIP', path)
                  return False
              p.write_text(s.replace(old,new,1)); print('PATCH',path); return True
          replace('js/state.js', "const PUBLIC_CATALOG_CACHE_TTL = 30 * 60 * 1000;\n", "const PUBLIC_CATALOG_CACHE_TTL = 30 * 60 * 1000;\nconst ASYNC_TIMEOUT_MS = 10000;\n\nfunction withTimeout(promise, ms = ASYNC_TIMEOUT_MS, label = 'Operation') {\n  let timer;\n  const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(`${label} timed out. Please try again.`)), ms); });\n  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));\n}\n")
          replace('js/state.js', "constructor() { this.subscribers = new Set(); this.init(); }", "constructor() { this.subscribers = new Set(); this.firebaseSessionRetries = 0; this.init(); }")
          replace('js/state.js', "const snapshot = await db.collection('users').doc(firebaseUser.uid).get();", "const snapshot = await withTimeout(db.collection('users').doc(firebaseUser.uid).get(), 7000, 'User profile lookup');")
          replace('js/state.js', "const snapshot = await db.collection('users').where(field, '==', firebaseUser.uid).limit(3).get();", "const snapshot = await withTimeout(db.collection('users').where(field, '==', firebaseUser.uid).limit(3).get(), 7000, `User ${field} lookup`);")
          replace('js/state.js', "const snapshot = await db.collection('users').where('email', '==', email).limit(5).get();", "const snapshot = await withTimeout(db.collection('users').where('email', '==', email).limit(5).get(), 7000, 'User email lookup');")
          replace('js/state.js', "const snapshot = await db.collection('library').where('userId', '==', candidate).limit(10).get();", "const snapshot = await withTimeout(db.collection('library').where('userId', '==', candidate).limit(10).get(), 7000, 'Library identity lookup');")
          replace('js/state.js', "this.token = await firebaseUser.getIdToken(false);", "this.token = await withTimeout(firebaseUser.getIdToken(false), 10000, 'Firebase authentication');")
          replace('js/state.js', "auth.onAuthStateChanged(async firebaseUser => {", "if (this.firebaseSessionListenerAttached) return;\n      this.firebaseSessionListenerAttached = true;\n      auth.onAuthStateChanged(async firebaseUser => {")
          replace('js/state.js', "    } catch (error) {\n      console.warn('Firebase session waiting:', error.message);\n      setTimeout(() => this.startFirebaseSession(), 500);\n    }", "    } catch (error) {\n      this.firebaseSessionListenerAttached = false;\n      this.firebaseSessionRetries += 1;\n      if (this.firebaseSessionRetries <= 30) setTimeout(() => { void this.startFirebaseSession(); }, 500);\n      else console.warn('Firebase session initialization stopped after repeated failures:', error.message);\n    }")
          replace('js/state.js', "const response = await fetch(apiUrl('/api/books'), { method: 'GET', headers: { Accept: 'application/json' }, credentials: 'omit', cache: 'no-store' });", "const response = await withTimeout(fetch(apiUrl('/api/books'), { method: 'GET', headers: { Accept: 'application/json' }, credentials: 'omit', cache: 'no-store' }), 10000, 'Book catalog request');")
          replace('js/state.js', "const booksSnapshot = await db.collection('books').where('status', '==', 'approved').get();", "const booksSnapshot = await withTimeout(db.collection('books').where('status', '==', 'approved').get(), 10000, 'Firebase catalog');")
          replace('js/state.js', "this.booksLoaded = this.booksLoaded || publicSyncSucceeded;", "this.booksLoaded = this.booksLoaded || publicSyncSucceeded || !this.books.length;")
          replace('js/app-safe.js', "if(main)main.innerHTML=`<div aria-label=\"Loading Bookora\" style=\"min-height:60vh;display:grid;place-items:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:64px;font-weight:600;letter-spacing:-0.055em;color:#12a879;user-select:none\">Bookora</div>`;", "if(main)main.innerHTML=`<div role=\"alert\" style=\"min-height:60vh;display:grid;place-items:center;text-align:center;padding:40px 20px;font-family:Inter,system-ui,sans-serif;color:#334155\"><div><strong style=\"display:block;font-size:20px;margin-bottom:8px\">This page could not be loaded.</strong><span style=\"display:block;font-size:14px;color:#64748b;margin-bottom:18px\">Please try again. Your account and saved data are unchanged.</span><button type=\"button\" id=\"bookora-route-retry\" style=\"border:0;border-radius:10px;padding:10px 16px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer\">Try again</button></div></div>`;document.getElementById('bookora-route-retry')?.addEventListener('click',()=>this.route(true,false));")
          replace('js/app-safe.js', "this.root.innerHTML=`<main id=\"main-content\" style=\"min-height:60vh;display:grid;place-items:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:64px;font-weight:600;letter-spacing:-0.055em;color:#12a879;user-select:none\">Bookora</main>`;", "this.root.innerHTML=`<main id=\"main-content\" role=\"alert\" style=\"min-height:60vh;display:grid;place-items:center;text-align:center;padding:40px 20px;font-family:Inter,system-ui,sans-serif;color:#334155\"><div><strong style=\"display:block;font-size:20px;margin-bottom:8px\">Bookora could not load this page.</strong><span style=\"display:block;font-size:14px;color:#64748b;margin-bottom:18px\">Please refresh or try again.</span><button type=\"button\" id=\"bookora-core-retry\" style=\"border:0;border-radius:10px;padding:10px 16px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer\">Try again</button></div></main>`;document.getElementById('bookora-core-retry')?.addEventListener('click',()=>this.route(true,false));")
          replace('js/bookora-branding-permanent-fix.js', "const safetySweep = setInterval(() => removeStartupOrphanBoxes(document.body),400);\n    window.__BOOKORA_LOADING_BOX_GUARD__ = safetySweep;", "const safetySweep = setInterval(() => removeStartupOrphanBoxes(document.body),1000);\n    window.__BOOKORA_LOADING_BOX_GUARD__ = safetySweep;\n    setTimeout(() => clearInterval(safetySweep), 5000);")
          replace('js/fast-firebase-init.js', "localStorage.setItem(CATALOG_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), books }));", "const cacheBooks = books.slice(0, 120).map(book => ({ id: book.id, status: book.status, title: book.title, author: book.author, slug: book.slug, category: book.category, cover_url: book.cover_url, pdf_file_id: book.pdf_file_id, pdf_url: book.pdf_url, sample_pdf_url: book.sample_pdf_url, created_at: book.created_at, createdAt: book.createdAt, is_new: book.is_new, is_trending: book.is_trending, is_bestseller: book.is_bestseller, price: book.price, sale_price: book.sale_price, rating: book.rating, averageRating: book.averageRating }));\n              localStorage.setItem(CATALOG_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), books: cacheBooks }));")
          PY
      - name: Syntax check
        run: |
          set -e
          for f in $(find js -name '*.js' -type f); do node --check "$f" >/dev/null; done
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden Bookora against freezes and infinite loading [skip ci]"
          git push
