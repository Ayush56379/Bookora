name: Activate permanent publish PDF progress fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch publish script versions
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('js/publish-direct-drive-runtime.js?v=20260828-3', 'js/publish-direct-drive-runtime.js?v=20260828-5')
          marker = '<script src="js/publish-live-upload-progress.js?v=20260828-3" defer></script>'
          addition = marker + '\n  <script src="js/publish-upload-progress-permanent-fix.js?v=20260828-1" defer></script>'
          if 'publish-upload-progress-permanent-fix.js' not in s and marker in s:
              s = s.replace(marker, addition, 1)
          # Force a fresh browser copy of the seller-action file too; the current
          # repository source is syntactically valid, while the screenshot showed
          # an older cached copy reporting a syntax error.
          s = s.replace('js/admin-seller-actions-firebase-first.js?v=20260828-1', 'js/admin-seller-actions-firebase-first.js?v=20260828-2')
          p.write_text(s, encoding='utf-8')
      - name: Commit activation
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Activation already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index.html
          git commit -m "chore: activate permanent publish progress fix"
          git push
