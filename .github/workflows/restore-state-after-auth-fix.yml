name: Apply newsletter CORS fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-newsletter-cors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove newsletter JSON preflight header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/components/Footer.js')
          s = p.read_text(encoding='utf-8')
          old = "headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({email})"
          new = "headers:{Accept:'application/json'},body:JSON.stringify({email})"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Newsletter CORS preflight fix applied')
          elif new in s:
              print('Newsletter CORS preflight fix already present')
          else:
              raise SystemExit('Expected newsletter fetch signature not found')
          PY
      - name: Commit newsletter fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/components/Footer.js
          if git diff --cached --quiet; then
            echo 'No newsletter changes needed'
          else
            git commit -m 'fix: make newsletter subscription CORS-simple'
            git push origin main
          fi
