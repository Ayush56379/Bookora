name: Restore state module after auth fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message == 'fix: keep Firebase token in memory when auth state is set'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore state.js from parent auth commit
        run: |
          git checkout 41fc4e1a105fb3022d106136a3bdeb2ec9cbeee1 -- js/state.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/state.js
          git commit -m 'chore: restore state module after auth fix'
          git push origin main
