name: Bump Homepage Catalog Cache

on:
  push:
    branches: [main]
    paths:
      - 'js/homepage-all-books-stable.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip catalog-cache]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Bump stable catalog runtime URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'js/homepage-all-books-stable.js?v=20260828-noop'
          new = 'js/homepage-all-books-stable.js?v=20260828-3'
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('homepage stable runtime tag not found')
          PY
      - name: Commit cache-bust
        run: |
          git config user.name "bookora-ai"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh homepage catalog runtime cache [skip catalog-cache]"
          git push origin main
