name: Bookora AI Responsive Design Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'tools/**/*.mjs'
      - '.github/workflows/ai-responsive-agent.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  responsive-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Bookora
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive scan and Groq AI repair
        env:
          BOOKORA_BASE_URL: https://ayush56379.github.io/Bookora/
          BOOKORA_RESPONSIVE_AI_URL: https://bookora-backend-x08l.onrender.com/api/ai/responsive-patch
        run: node tools/ai-responsive-agent.mjs

      - name: Publish generated responsive patch as PR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && hashFiles('css/ai-responsive-overrides.css') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- css/ai-responsive-overrides.css; then
            echo 'No AI responsive changes were generated.'
            exit 0
          fi
          BRANCH="ai/responsive-${GITHUB_RUN_ID}"
          git config user.name "bookora-ai"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add css/ai-responsive-overrides.css responsive-report || true
          git commit -m "fix: AI responsive layout corrections"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "AI responsive layout corrections" --body "Automated Bookora responsive-design pass. Tests the complete website at 280, 320, 375, 414, 600, 768, 1024, 1280, 1440, 1920, 2560 and 3840px widths and uses the existing Render Groq AI backend to repair responsive CSS only. Review the generated responsive report before merging."
