name: Apply Bookora Newsletter Footer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Bookora newsletter footer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply newsletter footer patch
        run: python newsletter_footer_patch.py
      - name: Commit patched footer
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/components/Footer.js
          git commit -m 'Apply Bookora newsletter footer'
          git push
