name: Production preview E2E

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-preview-e2e.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validator
        run: python -m pip install pypdf
      - name: Query production catalog and verify Pride and Prejudice sample
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, sys, base64, io, traceback
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import quote
          from pypdf import PdfReader
          result={"ok":False}
          base='https://bookora-backend-x08l.onrender.com'
          def get(path):
              req=Request(base+path, headers={'Accept':'application/json','User-Agent':'Bookora-production-e2e/1.0'})
              try:
                  with urlopen(req, timeout=45) as r: return r.status,dict(r.headers),r.read()
              except HTTPError as e: return e.code,dict(e.headers),e.read()
          try:
              status,headers,raw=get('/api/books?q='+quote('Pride'))
              result.update(catalog_status=status,catalog_content_type=headers.get('Content-Type',''))
              if status!=200: raise RuntimeError('CATALOG_HTTP_'+str(status)+': '+raw[:1000].decode('utf-8','replace'))
              catalog=json.loads(raw.decode('utf-8'))
              books=catalog if isinstance(catalog,list) else catalog.get('books',catalog.get('data',[])) if isinstance(catalog,dict) else []
              matches=[b for b in books if isinstance(b,dict) and ('pride and prejudice' in str(b.get('title','')).casefold() or 'pride & prejudice' in str(b.get('title','')).casefold())]
              result['match_count']=len(matches)
              result['catalog_titles']=[b.get('title') for b in books if isinstance(b,dict)][:20]
              if not matches: raise RuntimeError('PRIDE_NOT_FOUND_IN_Q_SEARCH')
              approved=[b for b in matches if str(b.get('status','')).strip().casefold()=='approved']
              book=approved[0] if approved else matches[0]
              book_id=str(book.get('id') or book.get('bookId') or book.get('book_id') or '').strip()
              result.update(title=book.get('title'),book_id=book_id,status=book.get('status'),source_type=book.get('source_type'),pdf_reference_present=bool(book.get('pdf_file_id') or book.get('pdfFileId') or book.get('driveFileId') or book.get('file_id') or book.get('fileId') or book.get('pdf_url') or book.get('pdfUrl')),preview_config={k:book.get(k) for k in ('preview_pages','previewPages','sample_page_numbers','samplePageNumbers') if k in book})
              if not book_id: raise RuntimeError('BOOK_ID_MISSING')
              if str(book.get('status','')).strip().casefold()!='approved': raise RuntimeError('BOOK_NOT_APPROVED')
              status,headers,raw=get('/api/books/'+quote(book_id,safe='')+'/sample?mode=selected')
              result.update(sample_status=status,sample_content_type=headers.get('Content-Type',''),sample_headers={k:v for k,v in headers.items() if k.lower() in ('content-type','content-length','access-control-allow-origin','cache-control','x-bookora-sample-pages')})
              if status!=200: raise RuntimeError('SAMPLE_HTTP_'+str(status)+': '+raw[:2000].decode('utf-8','replace'))
              payload=json.loads(raw.decode('utf-8')); preview=payload.get('preview') or {}
              if not payload.get('success'): raise RuntimeError('SAMPLE_SUCCESS_FALSE')
              if preview.get('type')!='pdf' or preview.get('mimeType')!='application/pdf': raise RuntimeError('SAMPLE_NOT_PDF')
              data=base64.b64decode(str(preview.get('data') or ''),validate=True)
              if not data.startswith(b'%PDF'): raise RuntimeError('PREVIEW_HEADER_INVALID')
              reader=PdfReader(io.BytesIO(data),strict=False); page_count=len(reader.pages); declared=int(payload.get('pageCount') or 0); pages=payload.get('previewPages') or []
              result.update(preview_bytes=len(data),preview_page_count=page_count,declared_page_count=declared,preview_pages=pages,book_id_match=(payload.get('bookId')==book_id),limited=payload.get('limited'))
              if page_count<=0 or declared!=page_count or len(pages)!=page_count or payload.get('bookId')!=book_id: raise RuntimeError('PREVIEW_VALIDATION_FAILED')
              result['ok']=True
          except Exception as exc:
              result['error']=str(exc); result['traceback']=traceback.format_exc(limit=3)
          with open('/tmp/production-preview-result.json','w') as f: json.dump(result,f,indent=2,sort_keys=True)
          print(json.dumps(result,indent=2)); sys.exit(0 if result.get('ok') else 1)
          PY
          RC=$?
          cp /tmp/production-preview-result.json production-preview-result.json
          exit $RC
      - name: Publish verification result
        if: always()
        shell: bash
        run: |
          if [ ! -f production-preview-result.json ]; then echo '{"ok":false,"error":"verification did not produce a result"}' > production-preview-result.json; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-preview-result.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record production preview verification result'
          git push
