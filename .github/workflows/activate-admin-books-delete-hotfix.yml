name: Activate admin books delete hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import admin books delete hotfix
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')
          marker = "import { initAdminBooksDeleteHotfix } from './admin-books-delete-hotfix.js';"
          if marker not in s:
              anchor = "import { renderAdminBooksPage, initAdminBooksEvents } from './pages/AdminBooksBackendPage.js';"
              if anchor not in s:
                  raise SystemExit('Admin Books backend import not found.')
              s = s.replace(anchor, anchor + "\n" + marker, 1)
          if 'initAdminBooksDeleteHotfix();' not in s:
              anchor = 'this.route(false, false);'
              # Start once after the SPA lifecycle is available; the hotfix watches
              # the Admin Books table and decorates removed records with controls.
              s = s.replace(anchor, anchor + "\n    try { initAdminBooksDeleteHotfix(); } catch (_) {}", 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --quiet || git commit -m "fix: activate admin books delete controls"
          git push
