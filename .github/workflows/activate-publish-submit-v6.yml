name: Activate publish submit v6 cache bust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate v6 submit runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'js/publish-upload-progress-permanent-fix.js?v=20260828-1'
          new = 'js/publish-upload-progress-permanent-fix.js?v=20260828-6'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('publish progress runtime reference not found')
          p.write_text(s, encoding='utf-8')
      - name: Commit cache-bust activation
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "v6 runtime already active."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: activate publish submit v6 cache bust"
          git push
