name: Finalize Bookora Upload Flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch upload limits and optional cover
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/pages/PublishInternalPage.js')
          s = p.read_text()
          s = s.replace('const MAX_PDF_SIZE = 15 * 1024 * 1024; // 15 MB', 'const MAX_PDF_SIZE = 100 * 1024 * 1024; // 100 MB')
          s = s.replace('PDF is too large. Maximum allowed size is 15 MB.', 'PDF is too large. Maximum allowed size is 100 MB.')
          s = s.replace('PDF must be 15 MB or smaller.', 'PDF must be 100 MB or smaller.')
          old = """  if (!selectedCover) {\n    Toast.show('Please select a cover image.', 'warning');\n    return false;\n  }\n"""
          s = s.replace(old, """  // Cover is optional. If it is omitted, the backend keeps the listing valid.\n""")
          p.write_text(s)

          marker = Path('.github/bookora-upload-patched')
          marker.write_text('done')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pages/PublishInternalPage.js .github/bookora-upload-patched
          git diff --cached --quiet || git commit -m "Allow 100MB PDF uploads without mandatory cover"
          git push
