name: Hide internal upload implementation wording

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean publish copy
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/pages/PublishInternalPage.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'Complete the steps below. Large files upload in resumable chunks and automatically retry temporary failures.': 'Complete the steps below to publish your eBook.',
            'The PDF is uploaded in small resumable chunks. Temporary network failures retry automatically, and the session survives a Render restart.': 'Everything is ready. Submit your eBook to send it for review. You can check the full book information in the Preview step before submitting.'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit clean copy
        shell: bash
        run: |
          if git diff --quiet -- js/pages/PublishInternalPage.js; then
            echo "Publish copy already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pages/PublishInternalPage.js
          git commit -m "chore: hide internal upload implementation wording"
          git push
