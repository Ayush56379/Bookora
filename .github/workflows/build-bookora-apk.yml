name: Build Bookora APK

on:
  push:
    branches:
      - apk/bookora-android
    paths:
      - 'android/**'
      - '.github/workflows/build-bookora-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Bookora.apk

      - name: Upload Bookora APK
        uses: actions/upload-artifact@v4
        with:
          name: Bookora-APK
          path: Bookora.apk
          if-no-files-found: error
          retention-days: 30
