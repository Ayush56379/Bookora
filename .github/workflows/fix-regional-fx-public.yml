name: Fix Regional FX Public Request
on:
  push:
    paths:
      - '.github/workflows/fix-regional-fx-public.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch FX rates to remain public
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/regional-currency-runtime.js')
          s = p.read_text(encoding='utf-8')
          old = "const data=await backend(`/api/fx/rates?base=INR&symbols=${encodeURIComponent(symbols)}`);"
          new = """const fxResponse=await fetch(`${API}/api/fx/rates?base=INR&symbols=${encodeURIComponent(symbols)}`,{headers:{Accept:'application/json'},credentials:'omit',cache:'no-store'});\nconst data=await fxResponse.json().catch(()=>({}));\nif(!fxResponse.ok)throw new Error(data.error||`FX rates HTTP ${fxResponse.status}`);"""
          if old not in s:
              raise SystemExit('Expected FX request line was not found; no changes made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/regional-currency-runtime.js
          git rm .github/workflows/fix-regional-fx-public.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m 'Fix public regional FX request auth error'
          git push

# One-time trigger: apply only the public FX request hotfix.
