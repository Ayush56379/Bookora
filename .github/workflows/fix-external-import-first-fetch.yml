name: Fix external importer first fetch
on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: external importer first-fetch auth race' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch first-fetch auth race
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/pages/PublishExternalPage.js')
          s = p.read_text()
          marker = 'EXTERNAL_IMPORTER_AUTH_WARMUP_V1'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)
          old = "  let createdBookId='';\n"
          new = """  let createdBookId='';\n\n  // EXTERNAL_IMPORTER_AUTH_WARMUP_V1\n  // Firebase auth can finish hydrating immediately after this SPA mounts.\n  // App.js reacts to USER_LOGGED_IN by routing again, which used to replace\n  // this importer DOM on the first Fetch click. Warm the auth session before\n  // enabling Fetch so the first click never races the auth-state render.\n  let externalAuthReady=false;\n  const originalFetchText=fetchBtn?.textContent || 'Fetch Book Information';\n  if(fetchBtn){\n    fetchBtn.disabled=true;\n    fetchBtn.setAttribute('aria-disabled','true');\n    fetchBtn.textContent='Preparing Secure Session…';\n    fetchBtn.style.opacity='0.7';\n    fetchBtn.style.cursor='wait';\n    getFreshFirebaseIdToken(false).then(token=>{\n      externalAuthReady=!!token;\n      if(fetchBtn && document.body.contains(fetchBtn)){\n        fetchBtn.disabled=!externalAuthReady;\n        fetchBtn.removeAttribute('aria-disabled');\n        fetchBtn.textContent=externalAuthReady ? originalFetchText : 'Sign In Required';\n        fetchBtn.style.opacity=externalAuthReady ? '' : '0.7';\n        fetchBtn.style.cursor=externalAuthReady ? '' : 'not-allowed';\n      }\n    }).catch(()=>{\n      externalAuthReady=false;\n      if(fetchBtn && document.body.contains(fetchBtn)) fetchBtn.textContent='Sign In Required';\n    });\n  }\n"""
          if old not in s:
              raise SystemExit('Target anchor not found')
          s = s.replace(old, new, 1)
          old_click = "  fetchBtn?.addEventListener('click',async()=>{\n    const url=urlInput?.value.trim();\n"
          new_click = "  fetchBtn?.addEventListener('click',async()=>{\n    if(!externalAuthReady){\n      Toast.show('Please wait for the secure sign-in session to finish loading.','info');\n      return;\n    }\n    const url=urlInput?.value.trim();\n"
          if old_click not in s:
              raise SystemExit('Click anchor not found')
          s = s.replace(old_click, new_click, 1)
          p.write_text(s)
          print('Patched external importer first-fetch auth race')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/pages/PublishExternalPage.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: external importer first-fetch auth race'
          git push
