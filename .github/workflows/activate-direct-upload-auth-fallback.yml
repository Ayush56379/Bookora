name: Activate direct upload auth fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add auth fallback script
        shell: bash
        run: |
          set -e
          if ! grep -q "firebase-auth-direct-upload-fallback.js" index.html; then
            python - <<'PY'
            from pathlib import Path
            p = Path('index.html')
            s = p.read_text(encoding='utf-8')
            marker = '<script type="module" src="js/auth-upload-progress-hotfix.js?v=1"></script>'
            insert = marker + '<script type="module" src="js/firebase-auth-direct-upload-fallback.js?v=20260821-1"></script>'
            if marker not in s:
                raise SystemExit('auth-upload-progress-hotfix script marker not found')
            p.write_text(s.replace(marker, insert, 1), encoding='utf-8')
            PY
          fi
      - name: Commit activation
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Direct upload auth fallback already active."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: activate direct Firebase upload auth fallback"
          git push
