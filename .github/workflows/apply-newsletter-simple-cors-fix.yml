name: Apply newsletter simple CORS fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply newsletter simple CORS fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch newsletter request
        run: python apply_newsletter_simple_cors_fix.py
      - name: Commit patched frontend
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/components/Footer.js
          git commit -m 'Apply newsletter simple CORS fix'
          git push
