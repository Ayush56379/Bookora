name: Fix book detail cover sizing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-book-detail-cover-size.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only book detail cover and pages icon CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('css/ebook-layout-global-fix.css')
          text = p.read_text(encoding='utf-8')
          marker = '/* BOOK DETAIL COVER INTRINSIC-SIZE FIX */'
          if marker in text:
              print('Patch already present; nothing to do.')
              raise SystemExit(0)
          patch = r'''

/* BOOK DETAIL COVER INTRINSIC-SIZE FIX */
/* Only .bd-page is affected. Real cover images determine the cover box height
   instead of leaving a fixed-ratio blue/background area underneath. */
#app .bd-page .bd-cover:has(.bd-cover-img:not(.is-failed)){
  aspect-ratio:auto!important;
  height:auto!important;
  background:transparent!important;
}
#app .bd-page .bd-cover:has(.bd-cover-img:not(.is-failed)) .bd-cover-img{
  position:relative!important;
  inset:auto!important;
  width:100%!important;
  height:auto!important;
  max-height:none!important;
  object-fit:contain!important;
  object-position:center!important;
}
#app .bd-page .bd-cover:has(.bd-cover-img:not(.is-failed)) .bd-cover-gloss{
  inset:0!important;
  height:100%!important;
}
/* If a real cover fails, keep the existing fallback card behavior. */
#app .bd-page .bd-cover:not(:has(.bd-cover-img:not(.is-failed))){
  aspect-ratio:3/4.2!important;
}

/* Pages/stat icons stay compact; the large book glyph must never inherit the
   cover/detail sizing. */
#app .bd-page .bd-stat-icon{
  width:24px!important;
  height:24px!important;
  min-width:24px!important;
  min-height:24px!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  font-size:16px!important;
  line-height:1!important;
  margin-bottom:8px!important;
}
#app .bd-page .bd-stat-icon svg{
  width:24px!important;
  height:24px!important;
  max-width:24px!important;
  max-height:24px!important;
  display:block!important;
  flex:0 0 24px!important;
}
#app .bd-page .bd-stat-pages svg{
  width:24px!important;
  height:24px!important;
}
'''
          p.write_text(text.rstrip() + patch + '\n', encoding='utf-8')
          PY
          git diff --check
          git diff -- css/ebook-layout-global-fix.css
      - name: Commit patch
        run: |
          git config user.name "bookora-ai"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/ebook-layout-global-fix.css
          git commit -m "fix: size book detail cover to image" || exit 0
          git push origin main
